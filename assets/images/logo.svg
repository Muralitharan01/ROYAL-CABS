<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" width="450" height="140">
  <defs>
    <style>
      .royal-text { font-family: 'Georgia', 'Times New Roman', serif; font-weight: 500; fill: #1c75bc; font-size: 58px; }
      .cabs-text { font-family: 'Georgia', 'Times New Roman', serif; font-weight: 500; fill: #f7941d; font-size: 58px; }
    </style>
  </defs>

  <!-- Top Orange Swoosh Arrow -->
  <path d="M 50 52 C 70 30, 120 28, 160 48 C 175 56, 185 68, 180 75 C 178 78, 172 75, 162 67 C 128 42, 85 45, 68 62 C 60 70, 58 78, 62 82 Z" fill="#f7941d" />
  <polygon points="175,76 186,77 182,66" fill="#f7941d" />

  <!-- Bottom Blue Swoosh Arrow -->
  <path d="M 152 86 C 132 108, 82 110, 42 90 C 27 82, 17 70, 22 63 C 24 60, 30 63, 40 71 C 74 96, 117 93, 134 76 C 142 68, 144 60, 140 56 Z" fill="#1c75bc" />
  <polygon points="27,62 16,61 20,72" fill="#1c75bc" />

  <!-- Central Car Silhouette -->
  <g transform="translate(62, 52) scale(0.65)">
    <!-- Car Body -->
    <path d="M 15 35 Q 20 18 35 12 L 85 12 Q 100 18 105 35 L 112 48 Q 115 55 115 70 L 5 70 Q 5 55 8 48 Z" fill="#112233" />
    <!-- Windshield -->
    <path d="M 32 20 L 88 20 L 98 40 L 22 40 Z" fill="#ffffff" opacity="0.9" />
    <!-- Headlights -->
    <ellipse cx="22" cy="54" rx="8" ry="4" fill="#ffffff" />
    <ellipse cx="98" cy="54" rx="8" ry="4" fill="#ffffff" />
    <!-- Wheels -->
    <rect x="8" y="65" width="16" height="15" rx="4" fill="#112233" />
    <rect x="96" y="65" width="16" height="15" rx="4" fill="#112233" />
  </g>

  <!-- Brand Text -->
  <text x="195" y="85" class="royal-text">Royal<tspan class="cabs-text">Cabs</tspan></text>
</svg>

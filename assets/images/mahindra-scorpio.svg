<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="suvBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="glass2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b2847" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0b2847" flood-opacity="0.18"/>
    </filter>
  </defs>
  
  <rect width="600" height="350" fill="url(#bgGrad2)" rx="16"/>
  <path d="M 0 285 L 600 285" stroke="#cbd5e1" stroke-width="4"/>
  
  <!-- SUV Group -->
  <g filter="url(#shadow2)">
    <!-- Tall SUV Body Frame -->
    <path d="M 70 255 L 70 170 L 150 140 L 440 140 L 510 180 L 540 255 Z" fill="url(#suvBody)" stroke="#64748b" stroke-width="2"/>
    
    <!-- SUV Glass Windows -->
    <path d="M 160 148 L 430 148 L 490 180 L 160 180 Z" fill="url(#glass2)" opacity="0.9"/>
    <path d="M 270 148 L 270 180" stroke="#f1f5f9" stroke-width="3"/>
    <path d="M 370 148 L 370 180" stroke="#f1f5f9" stroke-width="3"/>
    
    <!-- Roof Rails -->
    <rect x="180" y="132" width="240" height="6" rx="2" fill="#0b2847"/>
    <rect x="200" y="138" width="10" height="6" fill="#0b2847"/>
    <rect x="400" y="138" width="10" height="6" fill="#0b2847"/>
    
    <!-- Royal Cabs Brand Strip -->
    <path d="M 80 220 L 530 220 L 520 234 L 90 234 Z" fill="#ff6b00"/>
    <text x="310" y="231" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ROYAL CABS TIRUPUR • 7 SEATER SCORPIO</text>
    
    <!-- Taxi Roof Light -->
    <rect x="290" y="115" width="60" height="17" rx="4" fill="#ffb703" stroke="#0b2847" stroke-width="2"/>
    <text x="320" y="127" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#0b2847" text-anchor="middle">ROYAL TAXI</text>
    
    <!-- SUV Front Grille & Headlight -->
    <path d="M 520 200 L 540 200 L 535 240 L 515 240 Z" fill="#475569"/>
    <path d="M 505 195 C 525 195, 535 210, 525 215 Z" fill="#ffb703"/>

    <!-- Large Wheels -->
    <circle cx="160" cy="255" r="36" fill="#0f172a" stroke="#64748b" stroke-width="5"/>
    <circle cx="160" cy="255" r="18" fill="#94a3b8"/>
    <circle cx="450" cy="255" r="36" fill="#0f172a" stroke="#64748b" stroke-width="5"/>
    <circle cx="450" cy="255" r="18" fill="#94a3b8"/>
  </g>
  
  <!-- Vehicle Name Overlay -->
  <rect x="30" y="25" width="210" height="34" rx="8" fill="#0b2847"/>
  <text x="135" y="47" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">MAHINDRA SCORPIO</text>
</svg>

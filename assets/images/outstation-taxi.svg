<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="osBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0b2847"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#osBg)"/>
  
  <!-- Highway Road Lines -->
  <path d="M 0 320 L 180 180 L 220 180 L 500 320 Z" fill="#334155"/>
  <path d="M 200 180 L 200 320" stroke="#ffb703" stroke-width="4" stroke-dasharray="12,12"/>
  
  <!-- Mountain Silhouettes -->
  <path d="M 0 180 L 80 110 L 160 180 L 280 90 L 380 180 L 500 120 L 500 180 Z" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Outstation Car Graphic -->
  <g transform="translate(240, 200)">
    <rect width="160" height="65" rx="10" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
    <path d="M 15 40 L 35 18 L 125 18 L 145 40 Z" fill="#0b2847"/>
    <rect x="65" y="6" width="30" height="8" rx="2" fill="#ff6b00"/>
    <circle cx="40" cy="55" r="12" fill="#0f172a"/>
    <circle cx="120" cy="55" r="12" fill="#0f172a"/>
    <text x="80" y="36" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#ff6b00" text-anchor="middle">OUTSTATION</text>
  </g>
  
  <!-- Text Overlay -->
  <text x="30" y="45" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#ffffff">Outstation Taxi Service</text>
  <text x="30" y="70" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffb703">One-Way &amp; Round-Trip Outstation Journeys</text>
</svg>
